<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Car Animation — ITZFIZZ</title>
  
  <meta name="description" content="Scroll-driven hero section animation built with GSAP and ScrollTrigger." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="brand">
      <img src="logo.png" alt="iTZFiZZ Logo" class="brand-logo-img" />
    </div>
    <div class="scroll-hint">
      <span>SCROLL TO DRIVE</span>
      <div class="arrow-down">↓</div>
    </div>
  </header>

  <section class="section" id="scrollSection">
    <div class="track" id="track">
      
      <div class="text-box" id="box1">
        <span class="num-box">58%</span>
        <span class="desc-box">Increase in pick up point use</span>
      </div>

      <div class="text-box" id="box3">
        <span class="num-box">27%</span>
        <span class="desc-box">Increase in pick up point use</span>
      </div>

      <div class="road" id="road">
        <div class="trail" id="trail"></div>

        <img
          src="car.png"
          alt="McLaren 720S Top View"
          class="car"
          id="car"
        />

        <div class="value-add" id="valueText">
          <span class="value-letter">W</span>
          <span class="value-letter">E</span>
          <span class="value-letter">L</span>
          <span class="value-letter">C</span>
          <span class="value-letter">O</span>
          <span class="value-letter">M</span>
          <span class="value-letter">E</span>
          <span class="value-letter space">&nbsp;</span>
          <span class="value-letter">I</span>
          <span class="value-letter">T</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">F</span>
          <span class="value-letter">I</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">Z</span>
        </div>
      </div>

      <div class="text-box" id="box2">
        <span class="num-box">23%</span>
        <span class="desc-box">Decreased in customer phone calls</span>
      </div>

      <div class="text-box" id="box4">
        <span class="num-box">40%</span>
        <span class="desc-box">Decreased in customer phone calls</span>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
